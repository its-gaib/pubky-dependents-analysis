name: Deploy Pages

on:
  workflow_run:
    workflows: [Lint, Tests]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check required workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
    outputs:
      ready: ${{ steps.checks.outputs.ready }}
    steps:
      - name: Check all required workflows succeeded
        id: checks
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            for (const file of ['lint.yml', 'test.yml']) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: file,
                head_sha: sha,
                branch: 'main',
                event: 'push',
                per_page: 1,
              });
              if (runs.data.workflow_runs[0]?.conclusion !== 'success') {
                core.info(`Workflow "${file}" has not succeeded for commit ${sha}; skipping deployment.`);
                return;
              }
            }
            core.setOutput('ready', 'true');

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/
      - id: deployment
        uses: actions/deploy-pages@v5
