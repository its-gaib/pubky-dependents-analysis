name: Analyze Dependents

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: true
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install analysis and validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python analyze.py 2>&1 | tee analysis.log
      - name: Check for API cap
        run: |
          if grep -q 'hit the 1000-result API cap' analysis.log; then
            echo "ERROR: GitHub code search returned 1000 results (the API maximum)."
            echo "Some dependents are likely missing from the analysis."
            echo "Fix: split the gh search query in sources.py to stay under the cap."
            echo ""
            grep 'hit the 1000-result API cap' analysis.log
            exit 1
          fi
      - name: Validate generated data
        run: python -m pytest tests/test_data.py -v
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update dependents data"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
