name: Analyze Dependents

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
    - cron: '0 12,18 * * 1'  # Bounded recovery attempts Monday noon and 6pm UTC
    - cron: '0 0 * * 2'  # Final recovery attempt Tuesday midnight UTC
  workflow_dispatch:
    inputs:
      allow_large_decrease:
        description: Accept an independently verified large decrease
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: dependents-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: true
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install analysis and validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check whether this weekly cycle needs analysis
        id: cycle
        run: python publication.py >> "$GITHUB_OUTPUT"
      - name: Run analysis
        if: github.event_name == 'workflow_dispatch' || steps.cycle.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_LARGE_DECREASE: ${{ inputs.allow_large_decrease == true }}
        run: |
          args=()
          if [[ "$ALLOW_LARGE_DECREASE" == "true" ]]; then
            args+=(--allow-large-decrease)
          fi
          python analyze.py "${args[@]}"
      - name: Validate generated data
        run: python -m pytest tests/test_data.py -v
      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update dependents data"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
